aid: pixlee
name: Pixlee
description: >-
  Pixlee (Pixlee TurnTo, now part of Emplifi) is a visual and social user-generated
  content (UGC) marketing platform that helps brands collect, curate, moderate, and
  display customer photos and videos across their website, mobile apps, and email.
  The Pixlee Content API (v2) gives brands programmatic access to their approved
  media in albums with rich filtering and sorting, lets them ingest new content from
  a URL or an uploaded file, and add or update commerce products that media can be
  tagged with. Authentication is via an account API key passed as a query parameter,
  with HMAC-SHA1 request signing required for all writes. Pixlee also ships embeddable
  JavaScript display widgets, email display blocks, and native iOS/Android UI SDKs.
  Originally an a16z-backed startup, Pixlee was acquired by Emplifi.
